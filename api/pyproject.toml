[project]
name = "multimodal-assistant-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "pydantic-settings>=2.4,<3", "python-multipart>=0.0.9,<1"]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

